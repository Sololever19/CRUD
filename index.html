<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ClientHub — a full-featured CRUD portal for managing customer records, with search, reports, and secure admin login." />
  <title>ClientHub — Customer Management System</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Favicon inline SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><circle cx='18' cy='18' r='18' fill='%236c63ff'/><path d='M10 13h16M10 18h10M10 23h13' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/></svg>" />
</head>
<body>

<!-- ════════════════════════════════════════════════════════
     APP SHELL
     ════════════════════════════════════════════════════════ -->
<div id="shell">

  <!-- ── Sidebar (Module 1 – Navigation) ──────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
      </div>
      <div class="brand-text">
        <h2>ClientHub</h2>
        <p>Parikshit G</p>
      </div>
    </div>

    <nav class="nav-section">
      <div class="nav-label">Main</div>

      <a href="#dashboard" class="nav-link" id="nav-dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a href="#customers" class="nav-link" id="nav-customers">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
        All Customers
      </a>

      <a href="#add" class="nav-link" id="nav-add">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Add Customer
      </a>

      <div class="nav-label">Analytics</div>

      <a href="#reports" class="nav-link" id="nav-reports">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
        Reports
      </a>
    </nav>

    <!-- Logout (Module 7) -->
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn btn-outline" style="width:100%; justify-content:center; gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- ── Main Content Area ─────────────────────────────────── -->
  <div id="app">

    <!-- Top bar (visible only in logged-in state) -->
    <header id="top-header" style="display:none;">
      <div class="header-user">
        <div class="header-avatar" id="header-avatar">A</div>
        <span id="header-username">Admin</span>
      </div>
    </header>

    <!-- Dynamic page content injected here -->
    <main id="page-content"></main>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
     DELETE CONFIRMATION DIALOG (Module 1 / Module 2)
     ════════════════════════════════════════════════════════ -->
<div id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
    </div>
    <h3 id="modal-title">Delete Customer?</h3>
    <p>This action is permanent and cannot be undone. The customer record will be removed from the database.</p>
    <div class="modal-actions">
      <button id="delete-cancel" class="btn btn-outline">Cancel</button>
      <button id="delete-confirm" class="btn btn-danger">Yes, Delete</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
     TOAST CONTAINER
     ════════════════════════════════════════════════════════ -->
<div id="toast-container" aria-live="polite"></div>

<!-- ════════════════════════════════════════════════════════
     SCRIPTS — loaded in dependency order
     ════════════════════════════════════════════════════════ -->
<script src="js/db.js"></script>          <!-- Module 4: Database  -->
<script src="js/auth.js"></script>        <!-- Module 7: Security  -->
<script src="js/validation.js"></script>  <!-- Module 3: Validation -->
<script src="js/customers.js"></script>   <!-- Module 2: Customers  -->
<script src="js/reports.js"></script>     <!-- Module 6: Reports   -->
<script src="js/app.js"></script>         <!-- Module 1: UI / SPA  -->

<script>
  /* ── Post-render hook: sync header state ── */
  const _origRender = Router.render.bind(Router);
  Router.render = function () {
    _origRender();
    const loggedIn = Auth.isLoggedIn();
    document.getElementById('top-header').style.display = loggedIn ? '' : 'none';
    document.getElementById('sidebar').style.display    = loggedIn ? '' : 'none';
    if (loggedIn) {
      const user = Auth.getUser();
      const uname = user?.username || 'Admin';
      document.getElementById('header-username').textContent = uname;
      document.getElementById('header-avatar').textContent   = uname[0].toUpperCase();
    }
  };
</script>
</body>
</html>
